<div class="pt-32">
  <div
    class="max-w-2xl mx-auto p-6 bg-white rounded-xl shadow-md border border-slate-100"
  >
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-slate-800">
        Cadastrar Evento / Tarefa
      </h2>
      <p class="text-sm text-slate-500">
        // Preencha as informações abaixo para atualizar o objeto.
      </p>
    </div>

    <form class="space-y-5" [formGroup]="formGroup" (submit)="send()">
      <!-- Title -->
      <div>
        <label
          for="title"
          class="block text-sm font-medium text-slate-700 mb-1"
        >
          Título
        </label>
        <input
          type="text"
          formControlName="title"
          placeholder="Ex: Lançamento do Projeto"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all placeholder:text-slate-400"
          required
        />
      </div>

      <!-- Description -->
      <div>
        <label
          for="description"
          class="block text-sm font-medium text-slate-700 mb-1"
        >
          Descrição
        </label>
        <textarea
          formControlName="description"
          rows="3"
          placeholder="Descreva os detalhes importantes..."
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all placeholder:text-slate-400 resize-y"
        ></textarea>
      </div>

      <!-- Dates Grid (startDate & endDate) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label
            for="startDate"
            class="block text-sm font-medium text-slate-700 mb-1"
          >
            Data Inicial
          </label>
          <input
            type="datetime-local"
            formControlName="startDate"
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
            required
          />
        </div>

        <div>
          <label
            for="endDate"
            class="block text-sm font-medium text-slate-700 mb-1"
          >
            Data Final
          </label>
          <input
            type="datetime-local"
            formControlName="endDate"
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
            required
          />
        </div>
      </div>

      <!-- Status -->
      <div>
        <label
          for="status"
          class="block text-sm font-medium text-slate-700 mb-1"
        >
          Status
        </label>
        <select
          id="status"
          formControlName="status"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
        >
          <option value="" disabled selected>Selecione um status</option>
          @for (item of statusComp; track $index) {
            <option value="{{ item.value }}">{{ item.label }}</option>
          }
          {{
            statusComp
          }}
        </select>
      </div>

      <!-- Form Actions -->
      <div class="pt-4 flex items-center justify-end space-x-3">
        <button
          type="button"
          class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800 bg-transparent hover:bg-slate-100 rounded-lg transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-5 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all"
        >
          @if (this.compId()) {
            Editar
          } @else {
            Criar
          }
        </button>
      </div>
    </form>
  </div>
</div>
