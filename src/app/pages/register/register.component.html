<div class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Cadastrar</h2>
    <form>
      <div class="mb-4">
        <label for="fullName" class="block text-sm font-medium text-gray-700"
          >Nome Completo</label
        >
        <input
          type="text"
          id="fullName"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-violet-500 focus:border-violet-500 text-cyan-950"
          placeholder="Nome completo"
        />
      </div>
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700"
          >Email</label
        >
        <input
          type="email"
          id="email"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-violet-500 focus:border-violet-500 text-cyan-950"
          placeholder="Digite seu email"
        />
      </div>
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700"
          >Password</label
        >
        <input
          type="Senha"
          id="password"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-violet-500 focus:border-violet-500 text-cyan-950"
          placeholder="Digite sua senha"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-violet-700 text-white py-2 px-4 rounded hover:bg-violet-900 focus:outline-none"
      >
        Login
      </button>
    </form>
  </div>
</div>
